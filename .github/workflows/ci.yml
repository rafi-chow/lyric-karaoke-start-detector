name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Find project root
        shell: bash
        run: |
          set -e
          ROOT="."
          if [ ! -f "$ROOT/pyproject.toml" ]; then
            ROOT="$(dirname "$(find . -maxdepth 3 -name pyproject.toml -print -quit)")"
          fi
          echo "PROJECT_ROOT=$ROOT" >> $GITHUB_ENV
          echo "Using project root: $ROOT"

      - name: Install dependencies
        shell: bash
        run: |
          set -e
          cd "$PROJECT_ROOT"
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Train toy model (reproducible)
        shell: bash
        run: |
          set -e
          cd "$PROJECT_ROOT"
          python scripts/train_toy.py

      - name: Smoke inference (toy model)
        shell: bash
        run: |
          set -e
          cd "$PROJECT_ROOT"
          python scripts/smoke_toy_predict.py

      - name: Run unit tests
        shell: bash
        run: |
          set -e
          cd "$PROJECT_ROOT"
          pytest -q

      - name: Evaluate hand-labeled set
        shell: bash
        run: |
          set -e
          cd "$PROJECT_ROOT"
          python scripts/eval_handset.py --csv data/eval_handset.csv

