name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest scikit-learn joblib numpy

      - name: Train toy model
        run: |
          python scripts/train_toy.py

      - name: Smoke inference with toy model
        run: |
          python scripts/smoke_toy_predict.py

      - name: Run tests
        run: |
          pytest -q
