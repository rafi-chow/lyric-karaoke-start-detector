<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lyric Karaoke Detector</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <h1>Lyric Karaoke Start Detector</h1>

        <form id="upload-form" class="mb-3">
            <input type="file" id="audio-file" name="file" accept="audio/*" required>
            <button id="analyze-btn" type="submit" class="btn btn-primary ms-2">
                Analyze
            </button>
        </form>

        <div id="results" style="display:none;">
            <audio id="audio-player" controls class="w-100"></audio>

            <p id="karaoke-text" class="mt-2"></p>
            <button id="jump-btn" class="btn btn-success mt-2">
                Jump to karaoke start
            </button>

            <h3 class="mt-4">Detected lyric segments</h3>
            <ul id="segments-list"></ul>
        </div>
    </div>

    <script src="/static/main.js"></script>
</body>
</html>
